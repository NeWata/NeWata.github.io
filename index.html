<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Провальный сюжет этого злодея / The Antagonist's Miserable Plot</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0a0a12; color: #e0dcc8; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        #header {
            background: rgba(13, 13, 26, 0.95);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a3e;
            flex-shrink: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        #header h1 {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
            color: #f0e8c8;
            line-height: 1.3;
        }
        #header h1 .title-ru { color: #f0e8c8; }
        #header h1 .title-en {
            font-size: 13px;
            color: #888;
            font-weight: 300;
            letter-spacing: 1px;
        }
        #header h1 .separator { color: #d4c08a; margin: 0 8px; font-weight: 300; }
        #header-actions { display: flex; gap: 10px; align-items: center; }
        #header-actions span { font-size: 11px; color: #555; }
        #header-actions .admin-link {
            color: #d4c08a;
            text-decoration: none;
            font-size: 12px;
            padding: 4px 12px;
            border: 1px solid #d4c08a40;
            border-radius: 16px;
            transition: 0.3s;
        }
        #header-actions .admin-link:hover {
            background: #d4c08a20;
            border-color: #d4c08a;
        }

        #main { display: flex; flex: 1; overflow: hidden; }

        #sidebar {
            width: 260px;
            min-width: 260px;
            background: rgba(16, 16, 28, 0.95);
            border-right: 1px solid #1e1e30;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(4px);
        }
        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-thumb { background: #3a3a50; border-radius: 10px; }
        #sidebar h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 12px;
            border-bottom: 1px solid #1e1e30;
            padding-bottom: 10px;
        }
        #location-list { list-style: none; flex: 1; }
        #location-list li {
            background: rgba(22, 22, 34, 0.8);
            margin-bottom: 4px;
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid #d4c08a;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        #location-list li:hover { background: #1e1e32; transform: translateX(4px); }
        #location-list li .loc-name { font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #location-list li .loc-photos-count { font-size: 11px; color: #666; background: #0a0a12; padding: 1px 10px; border-radius: 10px; }
        .empty-msg { color: #444; text-align: center; font-style: italic; padding: 30px 0; font-size: 13px; }

        #map-container { flex: 1; position: relative; background: #0a0a12; }
        #map { width: 100%; height: 100%; background: #0a0a12; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .modal-content {
            background: #161624;
            border-radius: 16px;
            max-width: 750px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px 28px;
            border: 1px solid #2e2e48;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9);
            position: relative;
        }
        .modal-content::-webkit-scrollbar { width: 4px; }
        .modal-content::-webkit-scrollbar-thumb { background: #3a3a50; border-radius: 10px; }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 24px;
            color: #666;
            cursor: pointer;
            transition: 0.2s;
            background: none;
            border: none;
        }
        .modal-close:hover { color: #fff; transform: rotate(90deg); }

        .modal-header { margin-bottom: 16px; padding-right: 40px; }
        .modal-header h2 { font-size: 22px; color: #f0e8c8; }
        .modal-header .modal-desc { color: #aaa; font-size: 14px; margin-top: 4px; }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin: 12px 0;
        }
        .photo-gallery .photo-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: #0a0a12;
            border: 1px solid #2a2a40;
            cursor: pointer;
            transition: 0.2s;
            aspect-ratio: 1;
        }
        .photo-gallery .photo-item:hover { border-color: #d4c08a; transform: scale(1.02); }
        .photo-gallery .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-gallery .photo-item .photo-caption {
            padding: 6px 8px;
            font-size: 12px;
            color: #aaa;
            background: rgba(15, 15, 26, 0.9);
            border-top: 1px solid #1e1e30;
            min-height: 30px;
            word-wrap: break-word;
            line-height: 1.3;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
        }
        .photo-gallery .photo-item .photo-caption .caption-empty { color: #444; font-style: italic; font-size: 11px; }
        .no-photos { color: #444; font-style: italic; text-align: center; padding: 20px; }

        .custom-popup .leaflet-popup-content-wrapper {
            background: #161624;
            color: #eee;
            border-radius: 10px;
            border-left: 3px solid #d4c08a;
        }
        .custom-popup .leaflet-popup-tip { background: #161624; }
        .custom-popup .leaflet-popup-content {
            font-size: 13px;
            padding: 6px 12px;
            min-width: 140px;
            cursor: pointer;
        }
        .custom-popup .leaflet-popup-content b { color: #f0e8c8; }
        .popup-view-link {
            color: #d4c08a;
            font-size: 11px;
            display: block;
            text-align: center;
            margin-top: 4px;
            text-decoration: underline;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            #sidebar { width: 200px; min-width: 200px; }
            #header h1 { font-size: 15px; }
            #header h1 .title-en { font-size: 11px; }
            .modal-content { padding: 18px; }
            .photo-gallery { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }
        @media (max-width: 500px) {
            #sidebar { display: none; }
            #header h1 .title-en { display: none; }
            #header h1 .separator { display: none; }
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>
            <span class="title-ru">Провальный сюжет этого злодея</span>
            <span class="separator">/</span>
            <span class="title-en">The Antagonist's Miserable Plot</span>
        </h1>
        <div id="header-actions">
            <span id="sync-status">⏳ Загрузка...</span>
            <a href="a7k9x2m4.html" class="admin-link">Админ-панель</a>
        </div>
    </div>

    <div id="main">
        <div id="sidebar">
            <h2>Локации</h2>
            <ul id="location-list"><li class="empty-msg">Загрузка...</li></ul>
        </div>
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- Модалка просмотра -->
    <div class="modal-overlay" id="location-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close-btn">✕</button>
            <div class="modal-header">
                <h2 id="modal-title">Название</h2>
                <div class="modal-desc" id="modal-desc">Описание</div>
            </div>
            <div class="photo-gallery" id="modal-gallery"></div>
            <div id="modal-no-photos" class="no-photos">Нет фотографий</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================================
        //  КОНФИГУРАЦИЯ
        // ============================================================
        const SUPABASE_URL = 'https://ufekhgjpxnnoutiikkjk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmZWtoZ2pweG5ub3V0aWlra2prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNzIwNTYsImV4cCI6MjEwMjY0ODA1Nn0.Wc5_W5sD6VAVZVCg5hBlj2zvQCE72gTdX5KUXo0mqvs';
        const MAP_IMAGE_URL = 'image.png';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================================
        //  СОСТОЯНИЕ
        // ============================================================
        let locations = [];
        let mapInstance = null;
        let imageOverlay = null;
        let markerMap = new Map();
        let currentModalId = null;

        // ============================================================
        //  ЗАГРУЗКА ДАННЫХ
        // ============================================================
        async function loadLocations() {
            try {
                const { data, error } = await supabaseClient
                    .from('locations')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;

                locations = data || [];
                renderLocations();
                renderMarkers();
                document.getElementById('sync-status').textContent = '✅ Синхронизировано';
                document.getElementById('sync-status').style.color = '#4caf50';
                return true;
            } catch (e) {
                console.error('Ошибка загрузки:', e);
                document.getElementById('sync-status').textContent = '⚠️ Ошибка загрузки';
                document.getElementById('sync-status').style.color = '#ff5555';
                return false;
            }
        }

        // ============================================================
        //  КАРТА
        // ============================================================
        function initMap() {
            mapInstance = L.map('map', {
                center: [0, 0],
                zoom: 1.5,
                zoomControl: true,
                attributionControl: false,
                crs: L.CRS.Simple,
                minZoom: 0.5,
                maxZoom: 10
            });

            const bounds = [[-220, -400], [220, 400]];
            const img = new Image();
            img.onload = function() {
                if (imageOverlay) mapInstance.removeLayer(imageOverlay);
                imageOverlay = L.imageOverlay(MAP_IMAGE_URL, bounds, {
                    opacity: 1,
                    interactive: false
                }).addTo(mapInstance);
                mapInstance.fitBounds(bounds);
                mapInstance.setMaxBounds(bounds);
                console.log('Карта загружена');
            };
            img.onerror = function() {
                alert('Файл "image.png" не найден! Положите картинку рядом с index.html');
            };
            img.src = MAP_IMAGE_URL;

            renderMarkers();
        }

        // ============================================================
        //  ОТРИСОВКА
        // ============================================================
        function renderLocations() {
            const list = document.getElementById('location-list');
            if (!locations || locations.length === 0) {
                list.innerHTML = '<li class="empty-msg">Нет локаций</li>';
                return;
            }
            let html = '';
            locations.forEach(loc => {
                const count = loc.photos ? loc.photos.length : 0;
                html += `
                    <li data-id="${loc.id}" onclick="flyToLocation(${loc.id})">
                        <span class="loc-name">${loc.name}</span>
                        <span class="loc-photos-count">${count}</span>
                    </li>
                `;
            });
            list.innerHTML = html;
        }

        function renderMarkers() {
            if (!mapInstance) return;
            markerMap.forEach(m => mapInstance.removeLayer(m));
            markerMap.clear();

            const icon = L.divIcon({
                html: '📍',
                iconSize: [28, 28],
                className: 'custom-marker',
                iconAnchor: [14, 28]
            });

            locations.forEach(loc => {
                const marker = L.marker([loc.lat, loc.lng], { icon })
                    .addTo(mapInstance)
                    .bindPopup(`
                        <div style="text-align:center;cursor:pointer;" onclick="openModal(${loc.id})">
                            <b>${loc.name}</b><br>
                            <span style="color:#aaa;font-size:12px;">${(loc.description || '').substring(0, 50)}${(loc.description || '').length > 50 ? '...' : ''}</span>
                            <span class="popup-view-link">Открыть галерею</span>
                        </div>
                    `, { className: 'custom-popup', maxWidth: 200 });
                markerMap.set(loc.id, marker);
            });
        }

        // ============================================================
        //  НАВИГАЦИЯ
        // ============================================================
        function flyToLocation(id) {
            const loc = locations.find(l => l.id === id);
            if (!loc || !mapInstance) return;
            mapInstance.flyTo([loc.lat, loc.lng], 4, { duration: 1 });
            const marker = markerMap.get(id);
            if (marker) setTimeout(() => marker.openPopup(), 400);
        }

        // ============================================================
        //  МОДАЛКА ПРОСМОТРА
        // ============================================================
        function openModal(id) {
            const loc = locations.find(l => l.id === id);
            if (!loc) return;
            currentModalId = id;

            document.getElementById('modal-title').textContent = loc.name;
            document.getElementById('modal-desc').textContent = loc.description || 'Описание отсутствует';

            const gallery = document.getElementById('modal-gallery');
            const noPhotos = document.getElementById('modal-no-photos');
            gallery.innerHTML = '';

            const photos = loc.photos || [];
            if (photos.length === 0) {
                noPhotos.style.display = 'block';
            } else {
                noPhotos.style.display = 'none';
                photos.forEach((photo, idx) => {
                    const div = document.createElement('div');
                    div.className = 'photo-item';
                    const imgSrc = typeof photo === 'object' && photo.url ? photo.url : photo;
                    const cap = typeof photo === 'object' && photo.caption ? photo.caption : '';
                    div.innerHTML = `
                        <img src="${imgSrc}" loading="lazy" onclick="openViewer(${id}, ${idx})">
                        <div class="photo-caption">
                            ${cap ? cap : '<span class="caption-empty">Нет подписи</span>'}
                        </div>
                    `;
                    gallery.appendChild(div);
                });
            }

            document.getElementById('location-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        window.openModal = openModal;
        document.getElementById('modal-close-btn').addEventListener('click', () => {
            document.getElementById('location-modal').classList.remove('active');
            document.body.style.overflow = '';
        });
        document.getElementById('location-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('location-modal').classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        // ============================================================
        //  ПРОСМОТР ФОТО
        // ============================================================
        let viewerData = { photos: [], index: 0 };

        function openViewer(locId, index) {
            const loc = locations.find(l => l.id === locId);
            if (!loc || !loc.photos || loc.photos.length === 0) return;
            viewerData.photos = loc.photos;
            viewerData.index = index;
            showViewer();
        }

        function showViewer() {
            const overlay = document.createElement('div');
            overlay.id = 'photo-viewer-overlay';
            overlay.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.95); z-index: 99999;
                display: flex; justify-content: center; align-items: center;
                flex-direction: column; cursor: pointer;
                animation: fadeIn 0.25s ease;
            `;
            overlay.innerHTML = `
                <button style="position:absolute;top:20px;right:30px;font-size:32px;color:#fff;background:none;border:none;cursor:pointer;z-index:2;">✕</button>
                <button class="nav-btn prev" style="position:absolute;top:50%;left:20px;transform:translateY(-50%);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;transition:0.2s;z-index:2;">‹</button>
                <button class="nav-btn next" style="position:absolute;top:50%;right:20px;transform:translateY(-50%);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;transition:0.2s;z-index:2;">›</button>
                <img id="viewer-img" style="max-width:92%;max-height:80%;object-fit:contain;border-radius:8px;box-shadow:0 0 60px rgba(0,0,0,0.9);">
                <div id="viewer-caption" style="color:#aaa;font-size:15px;margin-top:16px;max-width:80%;text-align:center;line-height:1.5;"></div>
                <div id="viewer-counter" style="position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:#888;font-size:13px;background:rgba(0,0,0,0.5);padding:4px 16px;border-radius:16px;"></div>
            `;
            document.body.appendChild(overlay);
            document.body.style.overflow = 'hidden';

            const img = document.getElementById('viewer-img');
            const caption = document.getElementById('viewer-caption');
            const counter = document.getElementById('viewer-counter');

            function updateViewer() {
                const photo = viewerData.photos[viewerData.index];
                const url = typeof photo === 'object' && photo.url ? photo.url : photo;
                const cap = typeof photo === 'object' && photo.caption ? photo.caption : '';
                img.src = url;
                caption.textContent = cap;
                caption.style.display = cap ? 'block' : 'none';
                counter.textContent = `${viewerData.index + 1} / ${viewerData.photos.length}`;
            }
            updateViewer();

            overlay.querySelector('.viewer-close')?.addEventListener('click', () => overlay.remove());
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

            overlay.querySelector('.prev')?.addEventListener('click', (e) => {
                e.stopPropagation();
                if (viewerData.photos.length === 0) return;
                viewerData.index = (viewerData.index - 1 + viewerData.photos.length) % viewerData.photos.length;
                updateViewer();
            });
            overlay.querySelector('.next')?.addEventListener('click', (e) => {
                e.stopPropagation();
                if (viewerData.photos.length === 0) return;
                viewerData.index = (viewerData.index + 1) % viewerData.photos.length;
                updateViewer();
            });

            document.addEventListener('keydown', function(e) {
                if (!document.getElementById('photo-viewer-overlay')) return;
                if (e.key === 'Escape') overlay.remove();
                else if (e.key === 'ArrowLeft') overlay.querySelector('.prev')?.click();
                else if (e.key === 'ArrowRight') overlay.querySelector('.next')?.click();
            }, { once: true });
        }

        // ============================================================
        //  ЗАПУСК
        // ============================================================
        async function startApp() {
            await loadLocations();
            initMap();
            console.log('Атлас загружен');
        }

        startApp();
    </script>
</body>
</html>
