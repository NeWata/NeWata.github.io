/* ============================================================

/*
 * Приводит photos к нормальному массиву.
 *
 * Поддерживает:
 * [] 
 * "[...]"
 * { ... }
 * null
 */
function normalizePhotos(photos) {

    if (!photos) {
        return [];
    }

    if (Array.isArray(photos)) {
        return photos;
    }

    if (typeof photos === 'string') {
        try {
            const parsed = JSON.parse(photos);

            if (Array.isArray(parsed)) {
                return parsed;
            }

            if (parsed && typeof parsed === 'object') {
                return Object.values(parsed);
            }

            return [];
        } catch (error) {
            console.warn('Не удалось разобрать photos:', photos);
            return [];
        }
    }

    if (typeof photos === 'object') {
        return Object.values(photos);
    }

    return [];
}


/*
 * Получает URL фотографии независимо от формата.
 */
function getPhotoUrl(photo) {

    if (!photo) {
        return '';
    }

    if (typeof photo === 'string') {
        return photo;
    }

    if (typeof photo === 'object') {
        return (
            photo.url ||
            photo.image ||
            photo.src ||
            ''
        );
    }

    return '';
}


/*
 * Получает подпись.
 */
function getPhotoCaption(photo) {

    if (!photo || typeof photo !== 'object') {
        return '';
    }

    return (
        photo.caption ||
        photo.description ||
        photo.name ||
        ''
    );
}


/*
 * Экранирование текста перед вставкой в HTML.
 */
function escapeHtml(value) {

    const div = document.createElement('div');
    div.textContent = value ?? '';

    return div.innerHTML;
}


/*
 * Получить объект локации.
 */
function getLocation(id) {

    return locations.find(
        location => Number(location.id) === Number(id)
    );
}


/*
 * Сохранить только нормальный массив фотографий.
 */
function normalizeLocationPhotos(location) {

    location.photos = normalizePhotos(location.photos);

    return location.photos;
}


/* ============================================================
   STATUS
============================================================ */

function setMainStatus(text, color = '#888') {

    const element =
        document.getElementById('sync-status');

    if (!element) return;

    element.textContent = text;
    element.style.color = color;
}


function setAdminStatus(text, type = 'syncing') {

    const element =
        document.getElementById('admin-sync-status');

    if (!element) return;

    element.textContent = text;

    element.className =
        type === 'ok'
            ? 'status-ok'
            : type === 'error'
                ? 'status-error'
                : 'status-syncing';
}


/* ============================================================
   LOAD LOCATIONS
============================================================ */

async function loadLocations() {

    setMainStatus('⏳ Загрузка...', '#888');

    try {

        const { data, error } =
            await supabaseClient
                .from('locations')
                .select('*')
                .order('id', { ascending: true });

        if (error) {
            throw error;
        }

        locations = (data || []).map(location => {

            location.photos =
                normalizePhotos(location.photos);

            return location;
        });

        renderLocations();
        renderMarkers();

        setMainStatus(
            '✅ Синхронизировано',
            '#4caf50'
        );

            'Загружено локаций:',
            locations.length
        );

            'Данные локаций:',
            locations

        return true;

    } catch (error) {

        console.error(
            'Ошибка загрузки локаций:',
            error
        );

        setMainStatus(
            '⚠️ Ошибка загрузки',
            '#ff5555'
        );

        return false;
    }
}


/* ============================================================
   MAP
============================================================ */

function initMap() {

    mapInstance = L.map('map', {

        center: [0, 0],

        zoom: 1.5,

        zoomControl: true,

        attributionControl: false,

        crs: L.CRS.Simple,

        minZoom: 0.5,

        maxZoom: 10
    });


    const bounds = [
        [-220, -400],
        [220, 400]
    ];


    const image = new Image();


    image.onload = function () {

        if (imageOverlay) {

            mapInstance.removeLayer(
                imageOverlay
            );
        }


        imageOverlay =
            L.imageOverlay(
                MAP_IMAGE_URL,
                bounds,
                {
                    opacity: 1,
                    interactive: false
                }
            ).addTo(mapInstance);


        mapInstance.fitBounds(bounds);

        mapInstance.setMaxBounds(bounds);

        console.log('Карта загружена');
    };


    image.onerror = function () {

        console.error(
            'Не удалось загрузить карту:',
            MAP_IMAGE_URL
        );

        alert(
            'Файл "image.png" не найден. ' +
            'Положите image.png рядом с index.html.'
        );
    };


    image.src = MAP_IMAGE_URL;


    renderMarkers();
}


/* ============================================================
   LOCATIONS LIST
============================================================ */

function renderLocations() {

    const list =
        document.getElementById('location-list');

    if (!locations.length) {

        list.innerHTML =
            '<li class="empty-msg">Нет локаций</li>';

        return;
    }


    list.innerHTML = '';


    locations.forEach(location => {

        const photos =
            normalizePhotos(location.photos);


        const li =
            document.createElement('li');


        li.dataset.id =
            location.id;


        li.onclick = function () {

            flyToLocation(location.id);
        };


        const name =
            document.createElement('span');

        name.className =
            'loc-name';

        name.textContent =
            location.name || 'Без названия';


        const count =
            document.createElement('span');

        count.className =
            'loc-photos-count';

        count.textContent =
            photos.length;


        li.appendChild(name);

        li.appendChild(count);

        list.appendChild(li);
    });
}


/* ============================================================
   MARKERS
============================================================ */

function renderMarkers() {

    if (!mapInstance) {
        return;
    }


    markerMap.forEach(marker => {

        mapInstance.removeLayer(marker);
    });


    markerMap.clear();


    const icon =
        L.divIcon({

            html: '📍',

            iconSize: [28, 28],

            className: 'custom-marker',

            iconAnchor: [14, 28]
        });


    locations.forEach(location => {

        const description =
            location.description || '';


        const shortDescription =
            description.length > 50
                ? description.substring(0, 50) + '...'
                : description;


        const popup =
            document.createElement('div');


        popup.style.textAlign =
            'center';

        popup.style.cursor =
            'pointer';


        const title =
            document.createElement('b');

        title.style.color =
            '#f0e8c8';

        title.textContent =
            location.name || 'Без названия';


        const desc =
            document.createElement('span');

        desc.style.color =
            '#aaa';

        desc.style.fontSize =
            '12px';

        desc.textContent =
            shortDescription;


        const galleryLink =
            document.createElement('span');

        galleryLink.className =
            'popup-view-link';

        galleryLink.textContent =
            'Открыть галерею';


        popup.appendChild(title);

        popup.appendChild(
            document.createElement('br')
        );

        popup.appendChild(desc);

        popup.appendChild(galleryLink);


        popup.onclick = function () {

            openModal(location.id);
        };


        const marker =
            L.marker(
                [location.lat, location.lng],
                { icon }
            )
            .addTo(mapInstance)
            .bindPopup(
                popup,
                {
                    className: 'custom-popup',
                    maxWidth: 200
                }
            );


        markerMap.set(
            location.id,
            marker
        );
    });
}


/* ============================================================
   FLY TO LOCATION
============================================================ */

function flyToLocation(id) {

    const location =
        getLocation(id);


    if (!location || !mapInstance) {
        return;
    }


    mapInstance.flyTo(
        [
            location.lat,
            location.lng
        ],
        4,
        {
            duration: 1
        }
    );


    const marker =
        markerMap.get(id);


    if (marker) {

        setTimeout(
            () => marker.openPopup(),
            400
        );
    }
}


/* ============================================================
   LOCATION MODAL
============================================================ */

function openModal(id) {

    const location =
        getLocation(id);


    if (!location) {
        return;
    }


    currentModalId =
        id;


    document.getElementById(
        'modal-title'
    ).textContent =
        location.name || 'Без названия';


    document.getElementById(
        'modal-desc'
    ).textContent =
        location.description ||
        'Описание отсутствует';


    const gallery =
        document.getElementById(
            'modal-gallery'
        );


    const noPhotos =
        document.getElementById(
            'modal-no-photos'
        );


    gallery.innerHTML = '';


    const photos =
        normalizePhotos(
            location.photos
        );


    console.log(
        'Открываем галерею:',
        photos
    );


    if (!photos.length) {

        noPhotos.style.display =
            'block';

    } else {

        noPhotos.style.display =
            'none';


        photos.forEach(
            (photo, index) => {

                const url =
                    getPhotoUrl(photo);


                const caption =
                    getPhotoCaption(photo);


                if (!url) {

                    console.warn(
                        'У фотографии отсутствует URL:',
                        photo
                    );

                    return;
                }


                const item =
                    document.createElement('div');

                item.className =
                    'photo-item';


                const image =
                    document.createElement('img');


                image.src =
                    url;

                image.loading =
                    'lazy';


                image.alt =
                    caption || 'Фотография';


                image.onerror =
                    function () {

                        console.error(
                            'Фотография не загрузилась:',
                            url
                        );

                        this.style.opacity =
                            '0.2';

                        this.style.background =
                            '#330000';
                    };


                image.onclick =
                    function (event) {

                        event.stopPropagation();

                        openViewer(
                            id,
                            index
                        );
                    };


                const captionElement =
                    document.createElement('div');

                captionElement.className =
                    'photo-caption';


                if (caption) {

                    captionElement.textContent =
                        caption;

                } else {

                    const empty =
                        document.createElement('span');

                    empty.className =
                        'caption-empty';

                    empty.textContent =
                        'Нет подписи';

                    captionElement.appendChild(
                        empty
                    );
                }


                item.appendChild(image);

                item.appendChild(
                    captionElement
                );

                gallery.appendChild(item);
            }
        );
    }


    document.getElementById(
        'location-modal'
    ).classList.add('active');


    document.body.style.overflow =
        'hidden';
}


window.openModal =

/* ============================================================
   PHOTO VIEWER
============================================================ */

function openViewer(
    locationId,
    index
) {

    const location =
        getLocation(locationId);


    if (!location) {
        return;
    }


    const photos =
        normalizePhotos(
            location.photos
        );


    if (!photos.length) {
        return;
    }


    viewerData.photos =
        photos;

    viewerData.index =
        index;


    showViewer();
}


function showViewer() {

    const oldViewer =
        document.getElementById(
            'photo-viewer-overlay'
        );


    if (oldViewer) {
        oldViewer.remove();
    }


    const overlay =
        document.createElement('div');


    overlay.id =
        'photo-viewer-overlay';


    overlay.style.cssText = `
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.95);
        z-index: 99999;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    `;


    const close =
        document.createElement('button');


    close.textContent =
        '✕';


    close.style.cssText = `
        position:absolute;
        top:20px;
        right:30px;
        font-size:32px;
        color:#fff;
        background:none;
        border:none;
        cursor:pointer;
        z-index:2;
    `;


    const previous =
        document.createElement('button');


    previous.textContent =
        '‹';


    previous.className =
        'nav-btn prev';


    previous.style.cssText = `
        position:absolute;
        top:50%;
        left:20px;
        transform:translateY(-50%);
        background:rgba(255,255,255,0.05);
        border:1px solid rgba(255,255,255,0.1);
        color:#fff;
        width:44px;
        height:44px;
        border-radius:50%;
        font-size:20px;
        cursor:pointer;
        z-index:2;
    `;


    const next =
        document.createElement('button');


    next.textContent =
        '›';


    next.className =
        'nav-btn next';


    next.style.cssText = `
        position:absolute;
        top:50%;
        right:20px;
        transform:translateY(-50%);
        background:rgba(255,255,255,0.05);
        border:1px solid rgba(255,255,255,0.1);
        color:#fff;
        width:44px;
        height:44px;
        border-radius:50%;
        font-size:20px;
        cursor:pointer;
        z-index:2;
    `;


    const image =
        document.createElement('img');


    image.id =
        'viewer-img';


    image.style.cssText = `
        max-width:92%;
        max-height:80%;
        object-fit:contain;
        border-radius:8px;
    `;


    const caption =
        document.createElement('div');


    caption.id =
        'viewer-caption';


    caption.style.cssText = `
        color:#aaa;
        font-size:15px;
        margin-top:16px;
        max-width:80%;
        text-align:center;
    `;


    const counter =
        document.createElement('div');


    counter.id =
        'viewer-counter';


    counter.style.cssText = `
        position:absolute;
        bottom:30px;
        left:50%;
        transform:translateX(-50%);
        color:#888;
        font-size:13px;
        background:rgba(0,0,0,0.5);
        padding:4px 16px;
        border-radius:16px;
    `;


    overlay.appendChild(close);

    overlay.appendChild(previous);

    overlay.appendChild(next);

    overlay.appendChild(image);

    overlay.appendChild(caption);

    overlay.appendChild(counter);


    document.body.appendChild(
        overlay
    );


    document.body.style.overflow =
        'hidden';


    function updateViewer() {

        const photo =
            viewerData.photos[
                viewerData.index
            ];


        const url =
            getPhotoUrl(photo);


        const text =
            getPhotoCaption(photo);


        image.src =
            url;


        image.alt =
            text || 'Фотография';


        caption.textContent =
            text;


        caption.style.display =
            text ? 'block' : 'none';


        counter.textContent =
            `${viewerData.index + 1} / ${viewerData.photos.length}`;


        image.onerror =
            function () {

                console.error(
                    'Viewer не смог загрузить:',
                    url
                );
            };
    }


    function closeViewer() {

        overlay.remove();

        document.body.style.overflow =
            '';
    }


    close.onclick =
        closeViewer;


    overlay.onclick =
        function (event) {

            if (
                event.target ===
                overlay
            ) {

                closeViewer();
            }
        };


    previous.onclick =
        function (event) {

            event.stopPropagation();

            viewerData.index =
                (
                    viewerData.index -
                    1 +
                    viewerData.photos.length
                ) %
                viewerData.photos.length;

            updateViewer();
        };


    next.onclick =
        function (event) {

            event.stopPropagation();

            viewerData.index =
                (
                    viewerData.index +
                    1
                ) %
                viewerData.photos.length;

            updateViewer();
        };


    updateViewer();
}

/* ============================================================
   ADMIN AUTH
============================================================ */

async function checkAdminAuth() {

    try {

        const {
            data: { session }
        } =
            await supabaseClient.auth.getSession();


        if (session) {

            isAdmin = true;

            document.getElementById(
                'admin-login'
            ).style.display =
                'none';


            document.getElementById(
                'admin-panel-content'
            ).style.display =
                'block';


            document.getElementById(
                'admin-login-error'
            ).style.display =
                'none';


            await loadAdminLocations();

        } else {

            isAdmin = false;

            document.getElementById(
                'admin-login'
            ).style.display =
                'block';


            document.getElementById(
                'admin-panel-content'
            ).style.display =
                'none';
        }

    } catch (error) {

        console.error(
            'Ошибка проверки авторизации:',
            error
        );
    }
}


/* ============================================================
   LOGIN
============================================================ */

document
    .getElementById('admin-login-btn')
    .addEventListener(
        'click',
        adminLogin
    );


async function adminLogin() {

    const email =
        document
            .getElementById(
                'admin-email'
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                'admin-password'
            )
            .value;


    const errorElement =
        document.getElementById(
            'admin-login-error'
        );


    if (!email || !password) {

        errorElement.textContent =
            'Заполните email и пароль';

        errorElement.style.display =
            'block';

        return;
    }


    try {

        const {
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({
                    email,
                    password
                });


        if (error) {

            console.error(
                'Ошибка входа:',
                error
            );

            errorElement.textContent =
                'Неверный email или пароль';

            errorElement.style.display =
                'block';

            return;
        }


        errorElement.style.display =
            'none';


        isAdmin = true;


        document.getElementById(
            'admin-login'
        ).style.display =
            'none';


        document.getElementById(
            'admin-panel-content'
        ).style.display =
            'block';


        await loadAdminLocations();

    } catch (error) {

        console.error(
            error
        );

        errorElement.textContent =
            'Ошибка входа';

        errorElement.style.display =
            'block';
    }
}


document
    .getElementById('admin-password')
    .addEventListener(
        'keydown',
        function (event) {

            if (
                event.key ===

document
    .getElementById('admin-email')
    .addEventListener(
        'keydown',

            if (
                event.key ===
                'Enter'

/* ============================================================
   ADMIN LOCATIONS
============================================================ */

async function loadAdminLocations() {

    setAdminStatus(
        '⏳ Загрузка...',
        'syncing'
    );


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from('locations')
                .select('*')
                .order('id', {
                    ascending: true
                });


        if (error) {
            throw error;
        }


        locations =
            (data || []).map(
                location => {

                    location.photos =
                        normalizePhotos(
                            location.photos
                        );

                    return location;
                }
            );


        renderAdminList();

        renderLocations();

        renderMarkers();


        setAdminStatus(
            '✅ Синхронизировано',
            'ok'
        );

    } catch (error) {

        console.error(
            'Ошибка загрузки:',
            error
        );

        setAdminStatus(
            '⚠️ Ошибка загрузки',
            'error'
        );
    }
}


/* ============================================================
   ADMIN LIST
============================================================ */

function renderAdminList() {

    const list =
        document.getElementById(
            'admin-location-list'
        );


    list.innerHTML = '';


    if (!locations.length) {

        list.innerHTML =
            '<li style="color:#444;font-style:italic;padding:10px;border:none;">Нет локаций</li>';

        return;
    }


    locations.forEach(location => {

        const photos =
            normalizePhotos(
                location.photos
            );


        const li =
            document.createElement('li');


        const name =
            document.createElement('span');


        name.textContent =
            `${location.name || 'Без названия'} (${photos.length})`;


        const actions =
            document.createElement('div');


        actions.className =
            'loc-actions';


        const editButton =
            document.createElement('button');


        editButton.className =
            'edit';

        editButton.textContent =
            '✎';

        editButton.onclick =
            () => editLocation(
                location.id
            );


        const deleteButton =
            document.createElement('button');


        deleteButton.className =
            'del';

        deleteButton.textContent =
            '✕';

        deleteButton.onclick =
            () => deleteLocation(
                location.id
            );


        actions.appendChild(
            editButton
        );

        actions.appendChild(
            deleteButton
        );


        li.appendChild(name);

        li.appendChild(actions);

        list.appendChild(li);
    });
}

function editLocation(id) {

        'admin-location-name'

        location.name || '';

    renderAdminPhotos(

}

/* ============================================================
   ADMIN PHOTO GRID
============================================================ */

function renderAdminPhotos(location) {

    const grid =
        document.getElementById(
            'admin-photos-grid'
        );


    grid.innerHTML = '';


    const photos =
        normalizePhotos(
            location.photos
        );


    if (!photos.length) {

        grid.innerHTML =
            '<div style="color:#444;font-style:italic;padding:10px;text-align:center;">Нет фотографий</div>';

        return;
    }


    photos.forEach(
        (photo, index) => {

            const url =
                getPhotoUrl(photo);


            const caption =
                getPhotoCaption(photo);


            if (!url) {
                return;
            }


            const item =
                document.createElement('div');


            item.className =
                'photo-item';


            const image =
                document.createElement('img');


            image.src =
                url;


            image.loading =
                'lazy';


            image.alt =
                caption || 'Фото';


            image.onerror =
                function () {

                    console.error(
                        'Не загрузилось фото:',
                        url
                    );

                    this.style.opacity =
                        '0.25';
                };


            const captionElement =
                document.createElement('div');


            captionElement.className =
                'photo-caption';


            captionElement.textContent =
                caption || 'Без подписи';


            const deleteButton =
                document.createElement('button');


            deleteButton.className =
                'photo-del';

            deleteButton.textContent =
                '✕';


            deleteButton.onclick =
                function (event) {

                    event.stopPropagation();

                    deletePhoto(
                        location.id,
                        index
                    );
                };


            item.appendChild(image);

            item.appendChild(
                captionElement
            );

            item.appendChild(
                deleteButton
            );


            grid.appendChild(item);
        }
    );
}


/* ============================================================
   DELETE LOCATION
============================================================ */

async function deleteLocation(id) {

    if (
        !confirm(
            'Удалить эту локацию?'
        )
    ) {
        return;
    }


    try {

        const location =
            getLocation(id);


        /*
         * Сначала удаляем файлы фотографий
         * из Storage.
         */
        if (location) {

            const photos =
                normalizePhotos(
                    location.photos
                );


            const paths =
                photos
                    .map(
                        photo =>
                            getStoragePath(
                                getPhotoUrl(photo)
                            )
                    )
                    .filter(Boolean);


            if (paths.length) {

                const {
                    error:
                    storageError
                } =
                    await supabaseClient
                        .storage
                        .from(
                            STORAGE_BUCKET
                        )
                        .remove(paths);


                if (storageError) {

                    console.warn(
                        'Не удалось удалить некоторые файлы:',
                        storageError
                    );
                }
            }
        }


        const {
            error
        } =
            await supabaseClient
                .from('locations')
                .delete()
                .eq('id', id);


        if (error) {
            throw error;
        }


        locations =
            locations.filter(
                location =>
                    Number(location.id) !==
                    Number(id)
            );


        if (
            Number(editingId) ===
            Number(id)
        ) {

            editingId = null;

            clearEditor();
        }


        renderAdminList();

        renderLocations();

        renderMarkers();


        setAdminStatus(
            '✅ Локация удалена',
            'ok'
        );

    } catch (error) {

        console.error(
            'Ошибка удаления:',
            error
        );

        alert(
            'Ошибка удаления: ' +
            error.message
        );


        setAdminStatus(
            '⚠️ Ошибка удаления',
            'error'
        );
    }
}


window.deleteLocation =
    deleteLocation;


/* ============================================================
   GET STORAGE PATH
============================================================ */

function getStoragePath(url) {

    if (!url) {
        return null;
    }


    const marker =
        `/storage/v1/object/public/${STORAGE_BUCKET}/`;


    const index =
        url.indexOf(marker);


    if (index === -1) {
        return null;
    }


    return decodeURIComponent(
        url.substring(
            index + marker.length
        )
    );
}


/* ============================================================
   DELETE PHOTO
============================================================ */

async function deletePhoto(
    locationId,
    photoIndex
) {

    if (
        !confirm(
            'Удалить это фото?'
        )
    ) {
        return;
    }


    const location =
        getLocation(locationId);


    if (!location) {
        return;
    }


    const photos =
        normalizePhotos(
            location.photos
        );


    const photo =
        photos[photoIndex];


    if (!photo) {
        return;
    }


    try {

        const url =
            getPhotoUrl(photo);


        const path =
            getStoragePath(url);


        /*
         * Удаляем физический файл.
         */
        if (path) {

            const {
                error
            } =
                await supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .remove([path]);


            if (error) {

                console.warn(
                    'Ошибка удаления файла:',
                    error
                );
            }
        }


        /*
         * Удаляем запись из массива.
         */
        photos.splice(
            photoIndex,
            1
        );


        location.photos =
            photos;


        await saveLocations();


        renderAdminList();

        renderLocations();

        renderMarkers();

        renderAdminPhotos(
            location
        );


        setAdminStatus(
            '✅ Фото удалено',
            'ok'
        );

    } catch (error) {

        console.error(
            'Ошибка удаления фото:',
            error
        );


        alert(
            'Ошибка удаления фото: ' +
            error.message
        );


        setAdminStatus(
            '⚠️ Ошибка удаления фото',
            'error'
        );
    }
}


window.deletePhoto =
    deletePhoto;


/* ============================================================
   SAVE LOCATIONS
============================================================ */

async function saveLocations() {

    try {

        for (const location of locations) {

            location.photos =
                normalizePhotos(
                    location.photos
                );


            const {
                error
            } =
                await supabaseClient
                    .from('locations')
                    .upsert(
                        location,
                        {
                            onConflict: 'id'
                        }
                    );


            if (error) {
                throw error;
            }
        }


        setAdminStatus(
            '✅ Сохранено',
            'ok'
        );


        return true;

    } catch (error) {

        console.error(
            'Ошибка сохранения:',
            error
        );


        setAdminStatus(
            '⚠️ Ошибка сохранения',
            'error'
        );


        alert(
            'Ошибка сохранения: ' +
            error.message
        );


        return false;
    }
}

/* ============================================================
   PHOTO UPLOAD
============================================================ */

document
    .getElementById('admin-file-input')
    .addEventListener(
        'change',
        uploadPhotos
    );


async function uploadPhotos(event) {

    if (editingId === null) {

        alert(
            'Сначала выберите локацию для редактирования.'
        );

        event.target.value = '';

        return;
    }


    const files =
        Array.from(
            event.target.files || []
        );


    if (!files.length) {
        return;
    }


    const location =
        getLocation(
            editingId
        );


    if (!location) {
        return;
    }


    const caption =
        document
            .getElementById(
                'admin-caption-input'
            )
            .value
            .trim();


    const photos =
        normalizePhotos(
            location.photos
        );


    setAdminStatus(
        '⏳ Загрузка фотографий...',
        'syncing'
    );


    let uploaded =
        0;


    for (const file of files) {

        try {

            /*
             * Проверяем, что это изображение.
             */
            if (
                !file.type.startsWith(
                    'image/'
                )
            ) {

                console.warn(
                    'Пропущен не графический файл:',
                    file.name
                );

                continue;
            }


            /*
             * Уникальное имя.
             */
            const extension =
                getFileExtension(
                    file.name
                );


            const fileName =
                `${Date.now()}_${Math.random()
                    .toString(36)
                    .substring(2, 10)}.${extension}`;


            const filePath =
                `locations/${editingId}/${fileName}`;


            console.log(
                'Загрузка:',
                filePath
            );


            /*
             * Загружаем в Storage.
             */
            const {
                error:
                uploadError
            } =
                await supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .upload(
                        filePath,
                        file,
                        {
                            cacheControl:
                                '3600',

                            upsert:
                                false,

                            contentType:
                                file.type
                        }
                    );


            if (uploadError) {

                throw uploadError;
            }


            /*
             * Получаем публичный URL.
             */
            const {
                data:
                publicUrlData
            } =
                supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .getPublicUrl(
                        filePath
                    );


            if (
                !publicUrlData ||
                !publicUrlData.publicUrl
            ) {

                throw new Error(
                    'Supabase не вернул URL фотографии.'
                );
            }


            const photoObject = {

                url:
                    publicUrlData.publicUrl,

                caption:
                    caption
            };


            /*
             * Добавляем URL в locations.photos.
             */
            photos.push(
                photoObject
            );


            uploaded++;


            console.log(
                'Файл загружен:',
                publicUrlData.publicUrl
            );

        } catch (error) {

            console.error(
                'Ошибка загрузки:',
                error
            );


            alert(
                `Не удалось загрузить "${file.name}":\n${error.message}`
            );
        }
    }


    /*
     * Сохраняем массив фотографий в БД.
     */
    location.photos =
        photos;


    if (uploaded > 0) {

        const success =
            await saveLocations();


        if (success) {

            renderAdminList();

            renderLocations();

            renderMarkers();

            renderAdminPhotos(
                location
            );


            setAdminStatus(
                `✅ Загружено: ${uploaded}`,
                'ok'
            );
        }
    }


    event.target.value = '';


    document.getElementById(
        'admin-caption-input'
    ).value = '';
}


/* ============================================================
   FILE EXTENSION
============================================================ */

function getFileExtension(
    filename
) {

    const parts =
        filename.split('.');


    if (parts.length < 2) {
        return 'jpg';
    }


    return parts
        .pop()
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ''
        ) || 'jpg';
}
